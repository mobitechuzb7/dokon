<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telefon aksessuarlari</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#1b1b1b);
  --hint:var(--tg-theme-hint-color,#707579);
  --card:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --accent:var(--tg-theme-button-color,#2481cc);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px 12px 96px}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

.langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.langs .chip{padding:5px 12px;font-size:14px}

.top{position:sticky;top:0;background:var(--bg);padding-bottom:8px;z-index:5}
.field{width:100%;background:var(--card);border:0;border-radius:12px;padding:12px 14px}
.row{display:flex;gap:8px;margin-top:8px}
.row select{flex:0 0 46%}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.item{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:52px;background:color-mix(in srgb,var(--hint) 12%,transparent);cursor:pointer}
.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600;line-height:1.25}
.info .name{cursor:pointer}
.meta{color:var(--hint);font-size:13px}
.price{font-weight:700;margin-top:auto;padding-top:4px}
.add{border:0;border-radius:10px;background:var(--accent);color:var(--accent-text);padding:9px;cursor:pointer;margin-top:6px;width:100%}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:6px;background:var(--bg);border-radius:10px}
.step button{border:0;background:none;width:44px;height:38px;font-size:20px;cursor:pointer}
.empty{color:var(--hint);text-align:center;padding:40px 12px}

.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-text);border:0;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;cursor:pointer;font-weight:600}

h1{font-size:20px;margin:4px 0 12px}
h2{font-size:15px;color:var(--hint);font-weight:600;margin:16px 0 6px}
.backbar{position:sticky;top:0;z-index:6;background:var(--bg);padding:2px 0 10px}
.back{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--card);color:var(--text);padding:13px 18px;border-radius:12px;font-weight:600;font-size:17px;cursor:pointer}
.back::before{content:"←";font-size:22px;line-height:1;color:var(--accent)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--card)}
.line .name{flex:1}
.line .step{background:var(--card);margin:0}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding:14px 0}
form{display:flex;flex-direction:column;gap:8px}
label{font-size:14px;color:var(--hint)}
.err{color:#d93025;font-size:14px;min-height:20px}
.send{border:0;border-radius:14px;background:var(--accent);color:var(--accent-text);padding:14px;font-weight:600;cursor:pointer;width:100%}

.hero{position:relative;aspect-ratio:1;max-height:70vh;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:96px;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--hint) 12%,transparent)}
.hero img{width:100%;height:100%;object-fit:contain}
.hero.zoomable{cursor:zoom-in}
.hero b{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.big{font-size:22px;padding:0 0 4px}
.desc{white-space:pre-line;margin:0}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--card);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pill[aria-pressed="true"]{border-color:var(--accent)}
.pill i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.5)}
#detail .step{background:var(--card);margin-top:12px}
#detail .send{margin-top:12px}

#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92)}
#lbbox{position:absolute;inset:0;overflow:auto;display:flex}
#lbimg{margin:auto;display:block;cursor:zoom-in}
.lbtools{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:8px;z-index:51}
.lbtools button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer}
</style>
</head>
<body>

<div id="langs" class="langs" role="group" aria-label="Til / Язык / Language"></div>

<main id="shop">
  <div class="top">
    <input id="q" class="field" type="search" data-ip="search" aria-label="search">
    <div class="row">
      <select id="model" class="field" aria-label="model"></select>
    </div>
    <div id="cats" class="chips" role="group"></div>
  </div>
  <div id="list" class="grid"></div>
  <p id="none" class="empty hidden" data-i="none"></p>
  <button id="bar" class="bar hidden"><span id="barCount"></span><span id="barTotal"></span></button>
</main>

<section id="detail" class="hidden"></section>

<section id="cart" class="hidden">
  <div class="backbar"><button type="button" class="back" id="back" data-i="back"></button></div>
  <h1 data-i="cart"></h1>
  <div id="lines"></div>
  <div class="total"><span data-i="total"></span><span id="cartTotal"></span></div>
  <form id="form" novalidate>
    <label for="cname" data-i="yname"></label>
    <input id="cname" class="field" autocomplete="name">
    <label for="cphone" data-i="yphone"></label>
    <input id="cphone" class="field" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" autocomplete="tel">
    <label for="ccomment" data-i="comment"></label>
    <textarea id="ccomment" class="field" rows="2"></textarea>
    <div id="err" class="err" role="alert"></div>
    <button type="submit" class="send" data-i="order"></button>
  </form>
</section>

<div id="lb" class="hidden">
  <div id="lbbox"><img id="lbimg" alt=""></div>
  <div class="lbtools">
    <button type="button" data-z="-1" aria-label="−">−</button>
    <button type="button" data-z="1" aria-label="+">+</button>
    <button type="button" id="lbx" aria-label="×">×</button>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const ALL = "*";
const T = {
  uz: { title:"Telefon aksessuarlari", search:"Mahsulot qidirish", allModels:"Barcha modellar", all:"Hammasi",
    none:"Hech narsa topilmadi. Boshqa model yoki turkumni tanlang.", allPhones:"Barcha telefonlar uchun",
    add:"Qoʻshish", choose:"Rangni tanlash", cartN:"Savat: {n} ta", back:"Orqaga", cart:"Savat", total:"Jami",
    yname:"Ismingiz", yphone:"Telefon raqamingiz", comment:"Manzil yoki izoh (ixtiyoriy)", order:"Buyurtma berish",
    e1:"Ismingizni yozing.", e2:"Telefon raqamni toʻliq yozing.", e3:"Savat boʻsh.", empty:"Savat boʻsh.",
    cur:"soʻm", desc:"Xususiyatlari", color:"Rangi", pickColor:"Avval rangni tanlang.", toCart:"Savatga qoʻshish",
    models:"Mos telefonlar", loadErr:"Mahsulotlarni yuklab boʻlmadi. Ilovani qayta oching.", outside:"Telegram tashqarisida buyurtma yuborilmaydi." },
  ru: { title:"Аксессуары для телефонов", search:"Поиск товара", allModels:"Все модели", all:"Все",
    none:"Ничего не найдено. Выберите другую модель или категорию.", allPhones:"Для всех телефонов",
    add:"Добавить", choose:"Выбрать цвет", cartN:"Корзина: {n} шт.", back:"Назад", cart:"Корзина", total:"Итого",
    yname:"Ваше имя", yphone:"Ваш номер телефона", comment:"Адрес или комментарий (необязательно)", order:"Оформить заказ",
    e1:"Напишите ваше имя.", e2:"Введите номер телефона полностью.", e3:"Корзина пуста.", empty:"Корзина пуста.",
    cur:"сум", desc:"Характеристики", color:"Цвет", pickColor:"Сначала выберите цвет.", toCart:"Добавить в корзину",
    models:"Подходит для", loadErr:"Не удалось загрузить товары. Откройте приложение заново.", outside:"Вне Telegram заказ отправить нельзя." },
  en: { title:"Phone accessories", search:"Search products", allModels:"All models", all:"All",
    none:"Nothing found. Try another model or category.", allPhones:"For all phones",
    add:"Add", choose:"Choose color", cartN:"Cart: {n}", back:"Back", cart:"Cart", total:"Total",
    yname:"Your name", yphone:"Your phone number", comment:"Address or note (optional)", order:"Place order",
    e1:"Enter your name.", e2:"Enter the full phone number.", e3:"Your cart is empty.", empty:"Your cart is empty.",
    cur:"UZS", desc:"Details", color:"Color", pickColor:"Please choose a color first.", toCart:"Add to cart",
    models:"Fits", loadErr:"Could not load products. Please reopen the app.", outside:"Orders cannot be sent outside Telegram." }
};
let lang = "";
try { lang = localStorage.getItem("lang") || ""; } catch (e) {}
if (!T[lang]) {
  const lc = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "").slice(0, 2);
  lang = T[lc] ? lc : "uz";
}
const t = k => T[lang][k];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const tr = v => v && typeof v === "object" ? (v[lang] || v.uz || "") : (v || "");
const ck = p => typeof p.category === "object" ? p.category.uz : p.category;
const money = n => n.toLocaleString("ru-RU") + " " + t("cur");
const COLORS = {
  qora:["#111111","Чёрный","Black"], oq:["#ffffff","Белый","White"], kok:["#2563eb","Синий","Blue"],
  qizil:["#dc2626","Красный","Red"], yashil:["#16a34a","Зелёный","Green"], sariq:["#facc15","Жёлтый","Yellow"],
  pushti:["#ec4899","Розовый","Pink"], kulrang:["#9ca3af","Серый","Gray"], binafsha:["#9333ea","Фиолетовый","Purple"],
  "toq sariq":["#f97316","Оранжевый","Orange"], jigarrang:["#7c4a21","Коричневый","Brown"],
  zangori:["#14b8a6","Бирюзовый","Turquoise"], moviy:["#38bdf8","Голубой","Light blue"],
  havorang:["#7dd3fc","Голубой","Sky blue"], oltin:["#d4af37","Золотой","Gold"], kumush:["#c0c0c0","Серебристый","Silver"],
  bej:["#d9c3a0","Бежевый","Beige"], shaffof:["","Прозрачный","Transparent"],
  "toq kok":["#1e3a8a","Тёмно-синий","Dark blue"], "och kok":["#93c5fd","Светло-синий","Light blue"],
  grafit:["#3f3f46","Графитовый","Graphite"], titan:["#8d8f94","Титановый","Titanium"]
};
const nrm = s => String(s).toLowerCase().trim().replace(/[ʻʼ'‘’`]/g, "").replace(/\s+rang$/, "");
const hexOf = n => (COLORS[nrm(n)] || [])[0] || "";
function colorText(c) {
  const u = typeof c === "object" ? c.uz : c, k = COLORS[nrm(u)];
  return k ? (lang === "ru" ? k[1] : lang === "en" ? k[2] : u) : tr(c);
}
const cuz = c => typeof c === "object" ? c.uz : c;

let products = [], byId = {}, cart = {}, view = "shop";
let st = { q: "", model: ALL, cat: ALL }, det = { id: 0, color: "" };

fetch("products.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.json())
  .then(d => { products = d; products.forEach(p => byId[p.id] = p); renderFilters(); render(); })
  .catch(() => { $("list").innerHTML = '<p class="empty">' + esc(t("loadErr")) + "</p>"; });

function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll("[data-ip]").forEach(e => e.placeholder = t(e.dataset.ip));
}

function renderLangs() {
  $("langs").innerHTML = ["uz", "ru", "en"].map(l =>
    `<button type="button" class="chip" data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join("");
}

function renderFilters() {
  const models = [...new Set(products.flatMap(p => p.models || []))].sort();
  $("model").innerHTML = `<option value="${ALL}">${esc(t("allModels"))}</option>` + models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
  $("model").value = st.model;
  const seen = {};
  products.forEach(p => { if (!seen[ck(p)]) seen[ck(p)] = tr(p.category); });
  $("cats").innerHTML = [[ALL, t("all")], ...Object.entries(seen)].map(([k, l]) =>
    `<button type="button" class="chip" data-cat="${esc(k)}" aria-pressed="${k === st.cat}">${esc(l)}</button>`).join("");
}

function visible() {
  const q = st.q.trim().toLowerCase();
  return products.filter(p => {
    const names = (typeof p.name === "object" ? Object.values(p.name) : [p.name]).join(" ").toLowerCase();
    return (st.model === ALL || !(p.models || []).length || p.models.includes(st.model)) &&
      (st.cat === ALL || ck(p) === st.cat) &&
      (!q || names.includes(q) || (p.models || []).some(m => m.toLowerCase().includes(q)));
  });
}

function stepper(key) {
  return `<div class="step"><button type="button" data-dec="${esc(key)}" aria-label="−">−</button><span>${cart[key].qty}</span><button type="button" data-inc="${esc(key)}" aria-label="+">+</button></div>`;
}

function render() {
  const list = visible();
  $("none").classList.toggle("hidden", list.length > 0);
  $("list").innerHTML = list.map(p => {
    const hasC = (p.colors || []).length, key = p.id + "|";
    const act = hasC ? `<button type="button" class="add" data-open="${p.id}">${esc(t("choose"))}</button>`
      : cart[key] ? stepper(key) : `<button type="button" class="add" data-inc="${key}">${esc(t("add"))}</button>`;
    return `<article class="item">
      <div class="pic" data-open="${p.id}">${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : esc(p.emoji || "📱")}</div>
      <div class="info">
        <div class="name" data-open="${p.id}">${esc(tr(p.name))}</div>
        <div class="meta">${(p.models || []).length ? esc(p.models.join(", ")) : esc(t("allPhones"))}</div>
        <div class="price">${money(p.price)}</div>
        ${act}
      </div></article>`;
  }).join("");
  renderBar();
}

function totals() {
  let count = 0, sum = 0;
  for (const e of Object.values(cart)) { const p = byId[e.id]; if (p) { count += e.qty; sum += e.qty * p.price; } }
  return { count, sum };
}

function renderBar() {
  const { count, sum } = totals();
  $("bar").classList.toggle("hidden", count === 0 || view !== "shop");
  $("barCount").textContent = t("cartN").replace("{n}", count);
  $("barTotal").textContent = money(sum);
}

function colorLabel(p, u) {
  const c = (p.colors || []).find(x => cuz(x) === u);
  return c ? colorText(c) : u;
}

function renderCart() {
  const items = Object.entries(cart).filter(([, e]) => byId[e.id]);
  $("lines").innerHTML = items.length ? items.map(([key, e]) => {
    const p = byId[e.id];
    return `<div class="line">
      <div class="name">${esc(tr(p.name))}${e.color ? " · " + esc(colorLabel(p, e.color)) : ""}<div class="meta">${money(p.price)}</div></div>
      ${stepper(key)}
    </div>`;
  }).join("") : '<p class="empty">' + esc(t("empty")) + "</p>";
  $("cartTotal").textContent = money(totals().sum);
}

function renderDetail() {
  const p = byId[det.id];
  if (!p) return showView("shop");
  const cs = p.colors || [], key = p.id + "|" + det.color;
  const inCart = (!cs.length || det.color) && cart[key];
  const d = tr(p.desc);
  $("detail").innerHTML = `
    <div class="backbar"><button type="button" class="back" id="dback">${esc(t("back"))}</button></div>
    <div class="hero ${p.img ? "zoomable" : ""}" ${p.img ? `data-zoom="${esc(p.img)}"` : ""}>
      ${p.img ? `<img src="${esc(p.img)}" alt="${esc(tr(p.name))}"><b aria-hidden="true">⤢</b>` : esc(p.emoji || "📱")}
    </div>
    <h1 style="margin-top:12px">${esc(tr(p.name))}</h1>
    <div class="price big">${money(p.price)}</div>
    ${d ? `<h2>${esc(t("desc"))}</h2><p class="desc">${esc(d)}</p>` : ""}
    <h2>${esc(t("models"))}</h2>
    <p class="desc">${(p.models || []).length ? esc(p.models.join(", ")) : esc(t("allPhones"))}</p>
    ${cs.length ? `<h2>${esc(t("color"))}</h2><div class="colors">${cs.map(c => {
      const u = cuz(c), h = hexOf(u);
      return `<button type="button" class="pill" data-color="${esc(u)}" aria-pressed="${u === det.color}">${h ? `<i style="background:${h}"></i>` : ""}${esc(colorText(c))}</button>`;
    }).join("")}</div>` : ""}
    <div id="derr" class="err" role="alert"></div>
    ${inCart ? stepper(key) : `<button type="button" class="send" data-addd="1">${esc(t("toCart"))}</button>`}`;
}

function showView(v) {
  view = v;
  $("shop").classList.toggle("hidden", v !== "shop");
  $("detail").classList.toggle("hidden", v !== "detail");
  $("cart").classList.toggle("hidden", v !== "cart");
  if (tg && tg.BackButton) { if (v === "shop") tg.BackButton.hide(); else tg.BackButton.show(); }
  refresh();
  window.scrollTo(0, 0);
}

function refresh() {
  if (view === "shop") render();
  else if (view === "detail") renderDetail();
  else { if (!totals().count) return showView("shop"); renderCart(); }
}

function change(key, d) {
  const [id, ...c] = key.split("|");
  const e = cart[key] || (cart[key] = { id: Number(id), color: c.join("|"), qty: 0 });
  e.qty += d;
  if (e.qty <= 0) delete cart[key];
  refresh();
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  applyStatic(); renderLangs(); renderFilters(); refresh();
}

let zl = 1;
function zoomTo(z) {
  zl = Math.min(4, Math.max(1, z));
  const i = $("lbimg");
  if (zl === 1) { i.style.width = "auto"; i.style.maxWidth = "100%"; i.style.maxHeight = "100%"; }
  else { i.style.width = zl * 100 + "%"; i.style.maxWidth = "none"; i.style.maxHeight = "none"; }
}
function openLb(src) { $("lbimg").src = src; $("lb").classList.remove("hidden"); zoomTo(1); }
function closeLb() { $("lb").classList.add("hidden"); }

document.addEventListener("click", e => {
  const g = s => e.target.closest(s);
  let m;
  if ((m = g("[data-inc]"))) change(m.dataset.inc, 1);
  else if ((m = g("[data-dec]"))) change(m.dataset.dec, -1);
  else if ((m = g("[data-open]"))) { det = { id: Number(m.dataset.open), color: "" }; showView("detail"); }
  else if ((m = g("[data-zoom]"))) openLb(m.dataset.zoom);
  else if ((m = g("[data-color]"))) { det.color = m.dataset.color; renderDetail(); }
  else if (g("[data-addd]")) {
    const p = byId[det.id];
    if ((p.colors || []).length && !det.color) $("derr").textContent = t("pickColor");
    else change(det.id + "|" + det.color, 1);
  }
  else if (g("#dback")) showView("shop");
  else if ((m = g("[data-cat]"))) { st.cat = m.dataset.cat; renderFilters(); render(); }
  else if ((m = g("[data-lang]"))) setLang(m.dataset.lang);
  else if ((m = g("[data-z]"))) zoomTo(zl + Number(m.dataset.z));
  else if (g("#lbx")) closeLb();
  else if (g("#lbimg")) zoomTo(zl === 1 ? 2.5 : 1);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });
$("q").addEventListener("input", e => { st.q = e.target.value; render(); });
$("model").addEventListener("change", e => { st.model = e.target.value; render(); });
$("bar").addEventListener("click", () => showView("cart"));
$("back").addEventListener("click", () => showView("shop"));

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("cname").value.trim(), phone = $("cphone").value.trim();
  if (!name) return $("err").textContent = t("e1");
  if (phone.replace(/\D/g, "").length < 9) return $("err").textContent = t("e2");
  const { count, sum } = totals();
  if (!count) return $("err").textContent = t("e3");
  $("err").textContent = "";
  const order = {
    name, phone, comment: $("ccomment").value.trim(), total: sum,
    items: Object.values(cart).map(x => ({ id: x.id, color: x.color, qty: x.qty }))
  };
  if (tg) tg.sendData(JSON.stringify(order));
  else alert(t("outside") + "\n" + JSON.stringify(order, null, 2));
});

if (tg && tg.BackButton) tg.BackButton.onClick(() => {
  if (!$("lb").classList.contains("hidden")) closeLb(); else showView("shop");
});
applyStatic();
renderLangs();
</script>
</body>
</html>
