<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobitech.uzb</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f4f2;--sf:#fff;--ink:#111214;--mute:#7b7f87;--line:#e8e8e5;--btn:#111214;--bt:#fff;--ac:#d7261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f11;--sf:#1a1b1e;--ink:#f3f3f1;--mute:#8d9199;--line:#2a2c30;--btn:#f3f3f1;--bt:#111214}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px calc(104px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hidden{display:none!important}
img{display:block}

#head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.03em}
.logo span{color:var(--ac)}
.seg{display:flex;background:var(--sf);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--bt)}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:2px 0 10px}
.field{width:100%;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.row{margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sf);border-radius:999px;padding:8px 16px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--bt);border-color:var(--btn)}

h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px}
h2{font-size:15px;color:var(--mute);font-weight:600;margin:18px 0 6px}
.st{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:22px 0 12px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.hrow::-webkit-scrollbar{display:none}
.hrow .card{flex:0 0 150px;scroll-snap-align:start}
.card{background:var(--sf);border-radius:20px;padding:8px 8px 12px;display:flex;flex-direction:column}
.pic{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer}
.pic img{width:100%;height:100%;object-fit:cover}
.cn{font-weight:600;line-height:1.25;margin:10px 4px 0;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.cr{display:flex;align-items:center;justify-content:space-between;margin:8px 4px 0}
.cr b{font-size:15px;letter-spacing:-.01em}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:var(--btn);color:var(--bt);font-size:19px;font-weight:600;line-height:1}
.empty{color:var(--mute);text-align:center;padding:40px 12px}

.tile{border:0;text-align:left;background:var(--sf);border-radius:20px;padding:8px 8px 14px;display:flex;flex-direction:column}
.tp{aspect-ratio:1.3;border-radius:14px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:44px}
.tp img{width:100%;height:100%;object-fit:cover}
.tile b{margin:10px 4px 0;font-size:16px;letter-spacing:-.01em}
.tile small{margin:2px 4px 0;color:var(--mute)}

.step{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:14px}
.step button{border:0;background:none;width:44px;height:40px;font-size:20px}
.line{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:18px;padding:10px;margin-bottom:10px}
.lp{flex:none;width:60px;height:60px;border-radius:12px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:28px}
.lp img{width:100%;height:100%;object-fit:cover}
.line .nm{flex:1;font-weight:600;line-height:1.25}
.meta{color:var(--mute);font-size:13px;font-weight:400}
.line .step{flex:0 0 118px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:20px;letter-spacing:-.02em;padding:14px 2px}
form{display:flex;flex-direction:column;gap:8px}
label{font-size:13px;color:var(--mute);margin-top:4px}
.err{color:var(--ac);font-size:14px;min-height:20px}
.ok{color:#16a34a;font-size:14px;min-height:20px}
.hint{color:var(--mute);font-size:13px;margin:4px 0}
.send{border:0;border-radius:16px;background:var(--btn);color:var(--bt);padding:15px;font-weight:700;font-size:16px;width:100%}
.pcard{display:flex;align-items:center;gap:14px;background:var(--sf);border-radius:20px;padding:16px;margin-bottom:14px}
.ava{width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--bt);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.pname{font-size:18px;font-weight:700}

.backbar{position:sticky;top:0;z-index:6;background:var(--bg);padding:2px 0 10px}
.back{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--sf);color:var(--ink);padding:13px 18px;border-radius:14px;font-weight:600;font-size:17px}
.back::before{content:"←";font-size:22px;line-height:1}
.hero{position:relative;aspect-ratio:1;max-height:62vh;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:96px;border-radius:22px;overflow:hidden;background:var(--sf)}
.hero img{width:100%;height:100%;object-fit:contain}
.hero.zoomable{cursor:zoom-in}
.hero b{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.desc{white-space:pre-line;margin:0}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:var(--sf);border-radius:999px;padding:8px 15px;display:flex;align-items:center;gap:8px;font-weight:500}
.pill[aria-pressed="true"]{border-color:var(--ink)}
.pill i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.5)}
.dock{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--sf);border-radius:24px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 32px rgba(0,0,0,.16)}
.dp{font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.dock .send{flex:1;width:auto;padding:15px 12px;border-radius:18px}
.dock .step{flex:1}
.dock .step button{height:50px}
@keyframes fade{from{opacity:0}to{opacity:1}}
#detail{animation-name:fade}

#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--sf);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.14);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.nb{position:relative;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;font-weight:600;border-radius:18px}
.nb svg{width:24px;height:24px}
.nb[aria-pressed="true"]{color:var(--ink);background:var(--bg)}
.nb em{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#fff;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 5px}

#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92)}
#lbbox{position:absolute;inset:0;overflow:auto;display:flex}
#lbimg{margin:auto;display:block;cursor:zoom-in}
.lbtools{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:8px;z-index:51}
.lbtools button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sh{0%,100%{opacity:1}50%{opacity:.45}}
main,section{animation:in .24s ease both}
button{touch-action:manipulation;transition:transform .12s ease,background .2s,opacity .2s}
button:active{transform:scale(.96)}
.card,.tile{transition:transform .15s ease}
.card:active,.tile:active{transform:scale(.985)}
.pic img,.tp img,.lp img{opacity:0;transition:opacity .3s ease}
.pic img.ld,.tp img.ld,.lp img.ld{opacity:1}
.sk .pic{animation:sh 1.2s ease infinite}
.alt{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:14px;padding:13px;font-weight:600;margin-top:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--bt);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#banners{margin:2px -14px 4px;padding:0 14px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#banners::-webkit-scrollbar{display:none}
.bn{flex:0 0 88%;scroll-snap-align:center;border:0;padding:0;border-radius:22px;overflow:hidden;aspect-ratio:2/1;background:var(--sf)}
.bn img{width:100%;height:100%;object-fit:cover}
.pic{position:relative}
.badge{position:absolute;top:8px;left:8px;z-index:3;background:var(--ac);color:#fff;font-weight:800;font-size:12px;line-height:1;padding:5px 8px;border-radius:999px;pointer-events:none}
.sold{position:absolute;inset:0;z-index:2;background:rgba(0,0,0,.58);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:15px;font-weight:800;letter-spacing:.02em;pointer-events:none}
.hero .sold{font-size:22px}
.hero .badge{top:12px;left:12px;font-size:14px;padding:6px 11px}
.pr{display:flex;flex-direction:column;line-height:1.2}
.pr s{color:var(--mute);font-size:12px;font-weight:500}
.pr b{color:var(--ac)}
.plus.off{opacity:.35}
.dp s{display:block;color:var(--mute);font-size:12px;font-weight:500;letter-spacing:0}
.dp.dc{color:var(--ac)}
.send[disabled]{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>

<header id="head"><div class="logo">Mobitech<span>.uzb</span></div><div id="langs" class="seg" role="group" aria-label="Til / Язык / Language"></div></header>

<main id="shop">
  <div class="top">
    <input id="q" class="field" type="search" data-ip="search" aria-label="search">
    <div class="row"><select id="model" class="field" aria-label="model"></select></div>
    <div id="cats" class="chips" role="group"></div>
  </div>
  <div id="banners" class="hidden"></div>
  <div id="newBox" class="hidden"><h2 class="st" data-i="newest"></h2><div id="newRow" class="hrow"></div></div>
  <h2 id="allT" class="st" data-i="allProd"></h2>
  <div id="list" class="grid"></div>
  <p id="none" class="empty hidden" data-i="none"></p>
</main>

<section id="catsv" class="hidden"><h1 data-i="navCats"></h1><div id="catGrid" class="grid"></div></section>

<section id="detail" class="hidden"></section>

<section id="cart" class="hidden">
  <h1 data-i="cart"></h1>
  <div id="lines"></div>
  <div id="cartBox">
    <div class="total"><span data-i="total"></span><span id="cartTotal"></span></div>
    <form id="form" novalidate>
      <label for="cname" data-i="yname"></label>
      <input id="cname" class="field" autocomplete="name">
      <label for="cphone" data-i="yphone"></label>
      <input id="cphone" class="field" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" autocomplete="tel">
      <button type="button" id="locBtn" class="alt" data-i="locBtn"></button>
      <div id="locSt" class="ok" role="status"></div>
      <label for="ccomment" data-i="comment"></label>
      <textarea id="ccomment" class="field" rows="2"></textarea>
      <div id="err" class="err" role="alert"></div>
      <button type="submit" class="send" data-i="order"></button>
    </form>
  </div>
</section>

<section id="profile" class="hidden">
  <h1 data-i="profT"></h1>
  <div class="pcard"><div id="pAva" class="ava"></div><div id="pName" class="pname"></div></div>
  <form id="pform" novalidate>
    <label for="pn" data-i="yname"></label>
    <input id="pn" class="field" autocomplete="name">
    <label for="pp" data-i="yphone"></label>
    <input id="pp" class="field" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" autocomplete="tel">
    <label for="pa" data-i="address"></label>
    <textarea id="pa" class="field" rows="2"></textarea>
    <p class="hint" data-i="profHint"></p>
    <div id="pmsg" class="ok" role="status"></div>
    <button type="submit" class="send" data-i="save"></button>
  </form>
</section>

<div id="toast" role="status"></div>

<nav id="nav" aria-label="Menu"></nav>

<div id="lb" class="hidden">
  <div id="lbbox"><img id="lbimg" alt=""></div>
  <div class="lbtools">
    <button type="button" data-z="-1" aria-label="−">−</button>
    <button type="button" data-z="1" aria-label="+">+</button>
    <button type="button" id="lbx" aria-label="×">×</button>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const ALL = "*";
const T = {
  uz: { soldOut:"Qolmadi", search:"Mahsulot qidirish", allModels:"Barcha modellar", all:"Hammasi", none:"Hech narsa topilmadi. Boshqa model yoki turkumni tanlang.",
    allPhones:"Barcha telefonlar uchun", choose:"Rangni tanlash", back:"Orqaga", navHome:"Asosiy", navCats:"Kategoriya", navCart:"Savat", navProf:"Profil",
    newest:"Yangi mahsulotlar", allProd:"Barcha mahsulotlar", cart:"Savat", total:"Jami", yname:"Ismingiz", yphone:"Telefon raqamingiz",
    comment:"Manzil yoki izoh (ixtiyoriy)", order:"Buyurtma berish", e1:"Ismingizni yozing.", e2:"Telefon raqamni toʻliq yozing.", e3:"Savat boʻsh.",
    empty:"Savat hozircha boʻsh. Asosiy sahifadan mahsulot tanlang.", cur:"soʻm", desc:"Xususiyatlari", color:"Rangi", pickColor:"Avval rangni tanlang.",
    toCart:"Savatga qoʻshish", models:"Mos telefonlar", loadErr:"Mahsulotlarni yuklab boʻlmadi. Ilovani qayta oching.", outside:"Telegram tashqarisida buyurtma yuborilmaydi.",
    items:"{n} ta", added:"Savatga qoʻshildi ✓", e5:"Savatda mahsulot juda koʻp. Ikki qismga boʻlib buyurtma bering.", locBtn:"📍 Joylashuvimni yuborish", locOk:"Joylashuv olindi ✓", locErr:"Joylashuvni aniqlab boʻlmadi. Telegram sozlamalarida ruxsat bering yoki manzilni yozing.", e4:"Joylashuvni yuboring yoki manzilni yozing.", profT:"Mening maʼlumotlarim", address:"Manzil", save:"Saqlash", saved:"Saqlandi", profHint:"Maʼlumotlar shu qurilmada saqlanadi va buyurtma berishda oʻzi toʻldiriladi." },
  ru: { soldOut:"Нет в наличии", search:"Поиск товара", allModels:"Все модели", all:"Все", none:"Ничего не найдено. Выберите другую модель или категорию.",
    allPhones:"Для всех телефонов", choose:"Выбрать цвет", back:"Назад", navHome:"Главная", navCats:"Категории", navCart:"Корзина", navProf:"Профиль",
    newest:"Новинки", allProd:"Все товары", cart:"Корзина", total:"Итого", yname:"Ваше имя", yphone:"Ваш номер телефона",
    comment:"Адрес или комментарий (необязательно)", order:"Оформить заказ", e1:"Напишите ваше имя.", e2:"Введите номер телефона полностью.", e3:"Корзина пуста.",
    empty:"Корзина пока пуста. Выберите товар на главной.", cur:"сум", desc:"Характеристики", color:"Цвет", pickColor:"Сначала выберите цвет.",
    toCart:"В корзину", models:"Подходит для", loadErr:"Не удалось загрузить товары. Откройте приложение заново.", outside:"Вне Telegram заказ отправить нельзя.",
    items:"{n} шт.", added:"Добавлено в корзину ✓", e5:"В корзине слишком много товаров. Оформите заказ в два приёма.", locBtn:"📍 Отправить моё местоположение", locOk:"Местоположение получено ✓", locErr:"Не удалось определить местоположение. Разрешите доступ в настройках Telegram или напишите адрес.", e4:"Отправьте местоположение или напишите адрес.", profT:"Мои данные", address:"Адрес", save:"Сохранить", saved:"Сохранено", profHint:"Данные хранятся на этом устройстве и подставляются при оформлении заказа." },
  en: { soldOut:"Sold out", search:"Search products", allModels:"All models", all:"All", none:"Nothing found. Try another model or category.",
    allPhones:"For all phones", choose:"Choose color", back:"Back", navHome:"Home", navCats:"Categories", navCart:"Cart", navProf:"Profile",
    newest:"New arrivals", allProd:"All products", cart:"Cart", total:"Total", yname:"Your name", yphone:"Your phone number",
    comment:"Address or note (optional)", order:"Place order", e1:"Enter your name.", e2:"Enter the full phone number.", e3:"Your cart is empty.",
    empty:"Your cart is empty. Pick something on the home page.", cur:"UZS", desc:"Details", color:"Color", pickColor:"Please choose a color first.",
    toCart:"Add to cart", models:"Fits", loadErr:"Could not load products. Please reopen the app.", outside:"Orders cannot be sent outside Telegram.",
    items:"{n} items", added:"Added to cart ✓", e5:"Too many items in the cart. Please order in two parts.", locBtn:"📍 Share my location", locOk:"Location received ✓", locErr:"Could not get your location. Allow access in Telegram settings or type your address.", e4:"Share your location or type your address.", profT:"My details", address:"Address", save:"Save", saved:"Saved", profHint:"Details are stored on this device and filled in at checkout." }
};
let lang = "";
try { lang = localStorage.getItem("lang") || ""; } catch (e) {}
const tgu = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
if (!T[lang]) { const lc = ((tgu && tgu.language_code) || "").slice(0, 2); lang = T[lc] ? lc : "uz"; }
let prof = { name: "", phone: "", address: "" };
try { Object.assign(prof, JSON.parse(localStorage.getItem("prof") || "{}")); } catch (e) {}
if (!prof.name && tgu) prof.name = [tgu.first_name, tgu.last_name].filter(Boolean).join(" ");

const t = k => T[lang][k];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const tr = v => v && typeof v === "object" ? (v[lang] || v.uz || "") : (v || "");
const ck = p => typeof p.category === "object" ? p.category.uz : p.category;
const cuz = c => typeof c === "object" ? c.uz : c;
const money = n => n.toLocaleString("ru-RU") + " " + t("cur");
const nrm = s => String(s).toLowerCase().trim().replace(/[ʻʼ'‘’`]/g, "").replace(/\s+rang$/, "");

const COLORS = {
  qora:["#111111","Чёрный","Black"], oq:["#ffffff","Белый","White"], kok:["#2563eb","Синий","Blue"],
  qizil:["#dc2626","Красный","Red"], yashil:["#16a34a","Зелёный","Green"], sariq:["#facc15","Жёлтый","Yellow"],
  pushti:["#ec4899","Розовый","Pink"], kulrang:["#9ca3af","Серый","Gray"], binafsha:["#9333ea","Фиолетовый","Purple"],
  "toq sariq":["#f97316","Оранжевый","Orange"], jigarrang:["#7c4a21","Коричневый","Brown"],
  zangori:["#14b8a6","Бирюзовый","Turquoise"], moviy:["#38bdf8","Голубой","Light blue"],
  havorang:["#7dd3fc","Голубой","Sky blue"], oltin:["#d4af37","Золотой","Gold"], kumush:["#c0c0c0","Серебристый","Silver"],
  bej:["#d9c3a0","Бежевый","Beige"], shaffof:["","Прозрачный","Transparent"],
  "toq kok":["#1e3a8a","Тёмно-синий","Dark blue"], "och kok":["#93c5fd","Светло-синий","Light blue"],
  grafit:["#3f3f46","Графитовый","Graphite"], titan:["#8d8f94","Титановый","Titanium"]
};
const hexOf = n => (COLORS[nrm(n)] || [])[0] || "";
function colorText(c) {
  const u = cuz(c), k = COLORS[nrm(u)];
  return k ? (lang === "ru" ? k[1] : lang === "en" ? k[2] : u) : tr(c);
}
const CATS = {
  giloflar:["Чехлы","Cases"], gilof:["Чехлы","Cases"], chexol:["Чехлы","Cases"], chexollar:["Чехлы","Cases"],
  quloqchin:["Наушники","Headphones"], quloqchinlar:["Наушники","Headphones"], naushniklar:["Наушники","Headphones"],
  zaryadka:["Зарядные устройства","Chargers"], zaryadkalar:["Зарядные устройства","Chargers"],
  adapter:["Адаптеры","Adapters"], adapterlar:["Адаптеры","Adapters"],
  kabel:["Кабели","Cables"], kabellar:["Кабели","Cables"], simlar:["Кабели","Cables"],
  oyna:["Защитные стёкла","Screen protectors"], oynalar:["Защитные стёкла","Screen protectors"],
  "himoya oynalari":["Защитные стёкла","Screen protectors"], "himoya oynasi":["Защитные стёкла","Screen protectors"],
  "power bank":["Повербанки","Power banks"], powerbank:["Повербанки","Power banks"], powerbanklar:["Повербанки","Power banks"],
  soat:["Часы","Watches"], soatlar:["Часы","Watches"], "smart soatlar":["Смарт-часы","Smart watches"],
  ushlagich:["Держатели","Holders"], ushlagichlar:["Держатели","Holders"],
  karnay:["Колонки","Speakers"], karnaylar:["Колонки","Speakers"], kolonkalar:["Колонки","Speakers"],
  aksessuarlar:["Аксессуары","Accessories"], boshqa:["Другое","Other"]
};
function catText(p) {
  const u = ck(p), k = CATS[nrm(u)];
  return k ? (lang === "ru" ? k[0] : lang === "en" ? k[1] : u) : tr(p.category);
}

const ICON = {
  shop:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  catsv:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  cart:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'
};
const NAV = [["shop","navHome"],["catsv","navCats"],["cart","navCart"],["profile","navProf"]];
const VIEWS = ["shop", "catsv", "detail", "cart", "profile"];

let products = [], byId = {}, cart = {}, view = "shop", loc = null;
let st = { q: "", model: ALL, cat: ALL }, det = { id: 0, color: "" };

$("list").innerHTML = Array(6).fill('<div class="card sk"><div class="pic"></div><div class="cn">&nbsp;</div></div>').join("");
let catImg = {};
fetch("categories.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.ok ? r.json() : {})
  .then(d => { Object.entries(d).forEach(([k, v]) => catImg[nrm(k)] = v); if (view === "catsv") renderCats(); })
  .catch(() => {});
let banners = [];
fetch("banners.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.ok ? r.json() : [])
  .then(d => { banners = Array.isArray(d) ? d : []; renderBanners(); })
  .catch(() => {});
function renderBanners() {
  $("banners").innerHTML = banners.map((b, i) => `<button type="button" class="bn" data-bn="${i}"><img src="${esc(b.img)}" alt="" loading="lazy" decoding="async"></button>`).join("");
  $("banners").classList.toggle("hidden", !banners.length || !!(st.q.trim() || st.model !== ALL || st.cat !== ALL));
}
function fixImgs() {
  document.querySelectorAll(".pic img:not(.ld),.tp img:not(.ld),.lp img:not(.ld)").forEach(i => { if (i.complete) i.classList.add("ld"); });
}
fetch("products.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.json())
  .then(d => { products = d; products.forEach(p => byId[p.id] = p); renderFilters(); refresh(); })
  .catch(() => { $("list").innerHTML = '<p class="empty">' + esc(t("loadErr")) + "</p>"; });

function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll("[data-ip]").forEach(e => e.placeholder = t(e.dataset.ip));
}
function renderLangs() {
  $("langs").innerHTML = ["uz", "ru", "en"].map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join("");
}
function renderNav() {
  const n = totals().count;
  $("nav").innerHTML = NAV.map(([v, k]) => `<button type="button" class="nb" data-tab="${v}" aria-pressed="${view === v}" aria-label="${esc(t(k))}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[v]}</svg><span>${esc(t(k))}</span>${v === "cart" && n ? `<em>${n}</em>` : ""}</button>`).join("");
}
function renderFilters() {
  const models = [...new Set(products.flatMap(p => p.models || []))].sort();
  $("model").innerHTML = `<option value="${ALL}">${esc(t("allModels"))}</option>` + models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
  $("model").value = st.model;
  const seen = {};
  products.forEach(p => { if (!seen[ck(p)]) seen[ck(p)] = catText(p); });
  $("cats").innerHTML = [[ALL, t("all")], ...Object.entries(seen)].map(([k, l]) =>
    `<button type="button" class="chip" data-cat="${esc(k)}" aria-pressed="${k === st.cat}">${esc(l)}</button>`).join("");
}
function visible() {
  const q = st.q.trim().toLowerCase();
  return products.filter(p => {
    const names = (typeof p.name === "object" ? Object.values(p.name) : [p.name]).join(" ").toLowerCase();
    return (st.model === ALL || !(p.models || []).length || p.models.includes(st.model)) &&
      (st.cat === ALL || ck(p) === st.cat) &&
      (!q || names.includes(q) || (p.models || []).some(m => m.toLowerCase().includes(q)));
  });
}
function stepper(key) {
  return `<div class="step"><button type="button" data-dec="${esc(key)}" aria-label="−">−</button><span>${cart[key].qty}</span><button type="button" data-inc="${esc(key)}" aria-label="+">+</button></div>`;
}
const imgTag = src => `<img src="${esc(src)}" alt="" loading="lazy" decoding="async" onload="this.classList.add('ld')">`;
const thumb = p => p.img ? imgTag(p.img) : esc(p.emoji || "📱");
const pct = p => (p.discount && p.old_price && p.old_price > p.price) ? p.discount : 0;
const priceHtml = p => pct(p)
  ? `<span class="pr"><s>${money(p.old_price)}</s><b>${money(p.price)}</b></span>`
  : `<b>${money(p.price)}</b>`;
const badges = p => (pct(p) ? `<span class="badge">-${pct(p)}%</span>` : "")
  + (p.sold_out ? `<div class="sold">${esc(t("soldOut"))}</div>` : "");
function card(p) {
  const hasC = (p.colors || []).length, key = p.id + "|";
  const btn = p.sold_out ? `<button type="button" class="plus off" data-open="${p.id}" aria-label="${esc(t("soldOut"))}">+</button>`
    : hasC ? `<button type="button" class="plus" data-open="${p.id}" aria-label="${esc(t("choose"))}">+</button>`
    : `<button type="button" class="plus" data-inc="${key}" aria-label="+">${cart[key] ? cart[key].qty : "+"}</button>`;
  return `<article class="card"><div class="pic" data-open="${p.id}">${thumb(p)}${badges(p)}</div>
    <div class="cn" data-open="${p.id}">${esc(tr(p.name))}</div>
    <div class="cr">${priceHtml(p)}${btn}</div></article>`;
}
function render() {
  const list = visible(), filt = st.q.trim() || st.model !== ALL || st.cat !== ALL;
  const fresh = filt ? [] : [...products].sort((a, b) => b.id - a.id).slice(0, 6);
  $("newBox").classList.toggle("hidden", !fresh.length);
  $("banners").classList.toggle("hidden", !banners.length || !!filt);
  $("allT").classList.toggle("hidden", !!filt);
  $("newRow").innerHTML = fresh.map(card).join("");
  $("none").classList.toggle("hidden", list.length > 0);
  $("list").innerHTML = list.map(card).join("");
  fixImgs();
}
function renderCats() {
  const g = {};
  products.forEach(p => { const k = ck(p); (g[k] = g[k] || { p, n: 0 }).n++; });
  $("catGrid").innerHTML = Object.entries(g).map(([k, { p, n }]) =>
    `<button type="button" class="tile" data-gocat="${esc(k)}"><span class="tp">${catImg[nrm(k)] ? imgTag(catImg[nrm(k)]) : thumb(p)}</span><b>${esc(catText(p))}</b><small>${esc(t("items").replace("{n}", n))}</small></button>`).join("");
  fixImgs();
}
function totals() {
  let count = 0, sum = 0;
  for (const e of Object.values(cart)) { const p = byId[e.id]; if (p && !p.sold_out) { count += e.qty; sum += e.qty * p.price; } }
  return { count, sum };
}
function colorLabel(p, u) {
  const c = (p.colors || []).find(x => cuz(x) === u);
  return c ? colorText(c) : u;
}
function renderCart() {
  const items = Object.entries(cart).filter(([, e]) => byId[e.id]);
  $("lines").innerHTML = items.length ? items.map(([key, e]) => {
    const p = byId[e.id];
    return `<div class="line"><div class="lp">${thumb(p)}</div>
      <div class="nm">${esc(tr(p.name))}${e.color ? " · " + esc(colorLabel(p, e.color)) : ""}<div class="meta">${money(p.price)}${p.sold_out ? ` <span style="color:var(--ac)">· ${esc(t("soldOut"))}</span>` : ""}</div></div>${stepper(key)}</div>`;
  }).join("") : '<p class="empty">' + esc(t("empty")) + "</p>";
  $("cartBox").classList.toggle("hidden", !items.length);
  const viaBot = tg && !viaKeyboard();
  [...$("form").children].forEach(el => { if (el.id !== "err" && el.type !== "submit") el.classList.toggle("hidden", !!viaBot); });
  $("cartTotal").textContent = money(totals().sum);
  $("locSt").className = "ok"; $("locSt").textContent = loc ? t("locOk") : "";
  fixImgs();
  if (!$("cname").value) $("cname").value = prof.name;
  if (!$("cphone").value) $("cphone").value = prof.phone;
  if (!$("ccomment").value) $("ccomment").value = prof.address;
}
function renderProfile() {
  $("pAva").textContent = ((prof.name || "?").trim()[0] || "?").toUpperCase();
  $("pName").textContent = prof.name || t("navProf");
  $("pn").value = prof.name; $("pp").value = prof.phone; $("pa").value = prof.address; $("pmsg").textContent = "";
}
function renderDetail() {
  const p = byId[det.id];
  if (!p) return showView("shop");
  const cs = p.colors || [], key = p.id + "|" + det.color;
  const inCart = (!cs.length || det.color) && cart[key];
  const d = tr(p.desc);
  $("detail").innerHTML = `
    <div class="backbar"><button type="button" class="back" id="dback">${esc(t("back"))}</button></div>
    <div class="hero ${p.img ? "zoomable" : ""}" ${p.img ? `data-zoom="${esc(p.img)}"` : ""}>
      ${p.img ? `<img src="${esc(p.img)}" alt="${esc(tr(p.name))}"><b aria-hidden="true">⤢</b>` : esc(p.emoji || "📱")}
      ${badges(p)}
    </div>
    <h1 style="margin-top:16px">${esc(tr(p.name))}</h1>
    ${d ? `<h2>${esc(t("desc"))}</h2><p class="desc">${esc(d)}</p>` : ""}
    <h2>${esc(t("models"))}</h2>
    <p class="desc">${(p.models || []).length ? esc(p.models.join(", ")) : esc(t("allPhones"))}</p>
    ${cs.length ? `<h2>${esc(t("color"))}</h2><div class="colors">${cs.map(c => {
      const u = cuz(c), h = hexOf(u);
      return `<button type="button" class="pill" data-color="${esc(u)}" aria-pressed="${u === det.color}">${h ? `<i style="background:${h}"></i>` : ""}${esc(colorText(c))}</button>`;
    }).join("")}</div>` : ""}
    <div id="derr" class="err" role="alert"></div>
    <div style="height:96px"></div>
    <div class="dock"><div class="dp${pct(p) ? " dc" : ""}">${pct(p) ? `<s>${money(p.old_price)}</s>` : ""}${money(p.price)}</div>${p.sold_out ? `<button type="button" class="send" disabled>${esc(t("soldOut"))}</button>` : inCart ? stepper(key) : `<button type="button" class="send" data-addd="1">${esc(t("toCart"))}</button>`}</div>`;
}
function showView(v) {
  view = v;
  VIEWS.forEach(x => $(x).classList.toggle("hidden", x !== v));
  $("head").classList.toggle("hidden", v === "detail");
  $("nav").classList.toggle("hidden", v === "detail");
  if (tg && tg.BackButton) { if (v === "detail") tg.BackButton.show(); else tg.BackButton.hide(); }
  refresh();
  window.scrollTo(0, 0);
}
function refresh() {
  renderNav();
  if (view === "shop") render();
  else if (view === "catsv") renderCats();
  else if (view === "cart") renderCart();
  else if (view === "profile") renderProfile();
  else renderDetail();
}
function change(key, d) {
  const [id, ...c] = key.split("|");
  const e = cart[key] || (cart[key] = { id: Number(id), color: c.join("|"), qty: 0 });
  e.qty += d;
  if (e.qty <= 0) delete cart[key];
  if (view === "shop") {
    document.querySelectorAll(`.plus[data-inc="${key}"]`).forEach(b => b.textContent = cart[key] ? cart[key].qty : "+");
    renderNav();
  } else refresh();
}
const BOT = "mobitechuzbbot";
const viaKeyboard = () => !(tg.initDataUnsafe && tg.initDataUnsafe.query_id);
let tt;
function toast(m) {
  const e = $("toast"); e.textContent = m; e.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => e.classList.remove("on"), 1600);
}
function sendViaBot() {
  const parts = Object.values(cart).filter(x => byId[x.id] && !byId[x.id].sold_out).map(x => {
    const p = byId[x.id], ci = x.color ? (p.colors || []).findIndex(c => cuz(c) === x.color) : -1;
    return `${x.id}-${x.qty}-${ci < 0 ? "x" : ci}`;
  });
  const param = parts.join("_");
  if (!parts.length) return $("err").textContent = t("e3");
  if (param.length > 64) return $("err").textContent = t("e5");
  $("err").textContent = "";
  tg.openTelegramLink("https://t.me/" + BOT + "?start=" + param);
  setTimeout(() => tg.close(), 400);
}
function askLoc() {
  const ok = v => { $("locSt").className = v ? "ok" : "err"; $("locSt").textContent = v ? t("locOk") : t("locErr"); };
  const web = () => {
    if (!navigator.geolocation) return ok(false);
    navigator.geolocation.getCurrentPosition(
      p => { loc = { lat: p.coords.latitude, lon: p.coords.longitude }; ok(true); },
      () => ok(false), { enableHighAccuracy: true, timeout: 12000 });
  };
  const lm = tg && tg.LocationManager;
  if (!lm) return web();
  lm.init(() => lm.getLocation(d => { if (d) { loc = { lat: d.latitude, lon: d.longitude }; ok(true); } else web(); }));
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  applyStatic(); renderLangs(); renderFilters(); refresh();
}

let zl = 1;
function zoomTo(z) {
  zl = Math.min(4, Math.max(1, z));
  const i = $("lbimg");
  if (zl === 1) { i.style.width = "auto"; i.style.maxWidth = "100%"; i.style.maxHeight = "100%"; }
  else { i.style.width = zl * 100 + "%"; i.style.maxWidth = "none"; i.style.maxHeight = "none"; }
}
function openLb(src) { $("lbimg").src = src; $("lb").classList.remove("hidden"); zoomTo(1); }
function closeLb() { $("lb").classList.add("hidden"); }

document.addEventListener("click", e => {
  const g = s => e.target.closest(s);
  let m;
  if ((m = g("[data-inc]"))) change(m.dataset.inc, 1);
  else if ((m = g("[data-dec]"))) change(m.dataset.dec, -1);
  else if ((m = g("[data-open]"))) { det = { id: Number(m.dataset.open), color: "" }; showView("detail"); }
  else if ((m = g("[data-zoom]"))) openLb(m.dataset.zoom);
  else if ((m = g("[data-color]"))) { det.color = m.dataset.color; renderDetail(); }
  else if (g("[data-addd]")) {
    const p = byId[det.id];
    if ((p.colors || []).length && !det.color) $("derr").textContent = t("pickColor");
    else { change(det.id + "|" + det.color, 1); showView("shop"); toast(t("added")); }
  }
  else if ((m = g("[data-bn]"))) {
    const b = banners[Number(m.dataset.bn)] || {};
    if (b.id && byId[b.id]) { det = { id: Number(b.id), color: "" }; showView("detail"); }
    else if (b.cat) { st = { q: "", model: ALL, cat: b.cat }; $("q").value = ""; renderFilters(); showView("shop"); }
  }
  else if (g("#locBtn")) askLoc();
  else if (g("#dback")) showView("shop");
  else if ((m = g("[data-tab]"))) showView(m.dataset.tab);
  else if ((m = g("[data-gocat]"))) {
    st = { q: "", model: ALL, cat: m.dataset.gocat }; $("q").value = "";
    renderFilters(); showView("shop");
  }
  else if ((m = g("[data-cat]"))) { st.cat = m.dataset.cat; renderFilters(); render(); }
  else if ((m = g("[data-lang]"))) setLang(m.dataset.lang);
  else if ((m = g("[data-z]"))) zoomTo(zl + Number(m.dataset.z));
  else if (g("#lbx")) closeLb();
  else if (g("#lbimg")) zoomTo(zl === 1 ? 2.5 : 1);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });
let qt;
$("q").addEventListener("input", e => { st.q = e.target.value; clearTimeout(qt); qt = setTimeout(render, 150); });
$("model").addEventListener("change", e => { st.model = e.target.value; render(); });

$("pform").addEventListener("submit", e => {
  e.preventDefault();
  prof = { name: $("pn").value.trim(), phone: $("pp").value.trim(), address: $("pa").value.trim() };
  try { localStorage.setItem("prof", JSON.stringify(prof)); } catch (x) {}
  renderProfile();
  $("pmsg").textContent = t("saved");
});

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("cname").value.trim(), phone = $("cphone").value.trim();
  if (tg && !viaKeyboard()) return sendViaBot();
  if (!name) return $("err").textContent = t("e1");
  if (phone.replace(/\D/g, "").length < 9) return $("err").textContent = t("e2");
  const { count, sum } = totals();
  if (!count) return $("err").textContent = t("e3");
  if (!loc && !$("ccomment").value.trim()) return $("err").textContent = t("e4");
  $("err").textContent = "";
  const order = {
    name, phone, comment: $("ccomment").value.trim(), location: loc, total: sum,
    items: Object.values(cart).filter(x => byId[x.id] && !byId[x.id].sold_out).map(x => ({ id: x.id, color: x.color, qty: x.qty }))
  };
  if (tg) tg.sendData(JSON.stringify(order));
  else alert(t("outside") + "\n" + JSON.stringify(order, null, 2));
});

if (tg && tg.BackButton) tg.BackButton.onClick(() => {
  if (!$("lb").classList.contains("hidden")) closeLb(); else showView("shop");
});
applyStatic();
renderLangs();
renderNav();
</script>
</body>
</html>
